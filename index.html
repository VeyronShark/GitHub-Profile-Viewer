<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GitHub Profile Viewer</title>
        <link rel="stylesheet" href="style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
            integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.js"
            integrity="sha512-6/5zO9B3GKTKl45L4FHRPB/d5PamwD37Gnz+GGa18atcadWWcC+UQjbXKNVkMN+IY6tPrJvN/h3Wn5dZgXEYKg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
    </head>

    <body>
        <!--followers, following count, last 6 repos -->

        <div class="container">
            <header>
                <div class="upper">
                    <input
                        type="text"
                        id="search-bar"
                        placeholder="Enter GitHub username..."
                    />

                    <button type="button" id="search-btn">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        Search
                    </button>
                </div>

                <small id="search-error" hidden>Username not found</small>
            </header>

            <main>
                <div id="profile-heading"></div>

                <div id="follows"></div>

                <div id="repos"></div>
            </main>
        </div>
    </body>

    <script type="module" src="script.js"></script>
</html>
